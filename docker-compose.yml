# Icinga2 Deployment

networks:
  icinga2_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.31.0.0/16

volumes:
  icinga2-config:
  icinga2-data:
  icinga2-logs:
  icinga2-cache:
  icinga2-spool:

services:

  icinga2:
    build:
      context: ./icinga2
      dockerfile: Dockerfile
    image: icinga/icinga2:2.15.1
    container_name: icinga2-core
    restart: unless-stopped
    environment:
      - ICINGA_FEATURE_API=true
      - ICINGA_MASTER=1
      - ICINGA_CN=icinga2
      - ICINGA_ZONE=master
      - ICINGA_PARENT_ZONE=master
      - ICINGA_ACCEPT_CONFIG=1
      - ICINGA_ACCEPT_COMMANDS=1
      - ICINGA_DISABLE_CONFD=0
      - ICINGA_GLOBAL_ZONES=global-config
      - ICINGA_LISTEN=::,5665
      - ICINGA_FEATURE_API=true
      - ICINGA_API_USERS=root:icinga,admin:admin
    ports:
      - "5665:5665"
    volumes:
      - icinga2-config:/data/etc/icinga2
      - icinga2-data:/data/var/lib/icinga2
      - icinga2-logs:/data/var/log/icinga2
      - icinga2-cache:/data/var/cache/icinga2
      - icinga2-spool:/data/var/spool/icinga2
    networks:
      icinga2_network:
        ipv4_address: 172.31.0.2

  postgres:
    build:
      context: ./postgresql
      dockerfile: Dockerfile
    image: pg17-icinga:latest              # will be built automatically
    container_name: icinga2-postgresql
    restart: unless-stopped
    # Change these passwords in production!
    environment:
      POSTGRES_PASSWORD: postgres          # superuser password
      # If you ever want a different default DB/user, uncomment:
      # POSTGRES_USER: postgres
      # POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - /var/lib/postgresql/data:/var/lib/postgresql/data
    networks:
      icinga2_network:
        ipv4_address: 172.31.0.5